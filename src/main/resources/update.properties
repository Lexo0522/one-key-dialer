# Update-line configuration (shipped defaults).
# UpdateSources.load() overlays an optional external update.properties from the
# app data dir (%APPDATA%\PPoEDialer) on top of these keys, per key.
#
# update.sources: priority order, left = primary. The engine walks the lines
# serially (primary first; the next line only after the previous one failed).
# Lines are never fetched concurrently. A line listed here but disabled below
# is dropped from the chain.

update.sources=gitee,github
# HttpClient connect timeout (DNS + TCP + TLS), shared by all lines.
update.connectTimeoutMs=5000

# ---------------- primary line: Gitee mirror (mainland-friendly) ----------------
source.gitee.enabled=true
source.gitee.displayName=Gitee
source.gitee.api=https://gitee.com/api/v5/repos/kate522/one-key-dialer/releases/latest
# Primary line runs an independent short timeout plus exactly one retry.
source.gitee.checkTimeoutMs=8000
source.gitee.checkAttempts=2
source.gitee.downloadAttempts=2
source.gitee.downloadHeaderTimeoutMs=30000
source.gitee.stallTimeoutMs=30000
# Simple breaker: after this many consecutive failures the line is skipped for
# breakerCooldownMs; a half-open probe runs when the cooldown expires.
source.gitee.breakerThreshold=2
source.gitee.breakerCooldownMs=600000

# ---------------- backup line: GitHub (release source of truth) ----------------
source.github.enabled=true
source.github.displayName=GitHub
source.github.api=https://api.github.com/repos/Lexo0522/one-key-dialer/releases/latest
source.github.checkTimeoutMs=12000
source.github.checkAttempts=1
source.github.downloadAttempts=3
source.github.downloadHeaderTimeoutMs=60000
source.github.stallTimeoutMs=60000
source.github.breakerThreshold=3
source.github.breakerCooldownMs=600000
