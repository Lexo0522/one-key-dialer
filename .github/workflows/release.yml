name: Release

# Pushing tag v<version.txt> builds and publishes the GitHub Release with the
# three artifacts the in-app updater expects (ZIP + MSI + SHA256SUMS.txt).
# workflow_dispatch builds and verifies the assets without publishing.
#
# The artifact contract is load-bearing: internal/update scores assets by name
# (.zip preferred when the install dir is writable, .msi otherwise) and refuses
# to install anything not listed in SHA256SUMS.txt. Do not rename the files.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag matches canonical version
        shell: pwsh
        run: |
          $rev = (Get-Content version.txt -Raw).Trim()
          if (-not $rev) {
            Write-Error "version.txt is empty"
            exit 1
          }
          $tag = "${{ github.ref_name }}"
          if ("${{ github.ref_type }}" -eq "tag") {
            if ($tag -ne "v$rev") {
              Write-Error "tag '$tag' does not match version.txt (requires tag v$rev)"
              exit 1
            }
          } else {
            $tag = "v$rev"
          }
          Add-Content $env:GITHUB_ENV "APP_VERSION=$rev"
          Add-Content $env:GITHUB_ENV "TAG=$tag"
          Write-Host "Canonical version: $rev -> tag $tag"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run unit tests
        run: go test ./... -count=1

      - name: Sync exe metadata version from version.txt
        shell: pwsh
        run: |
          # wails.json 的 info.productVersion 渲染进 exe 的 Windows 属性
          # （File/ProductVersion）。发布时以 version.txt 为准，避免两处漂移。
          $rev = $env:APP_VERSION
          $raw = Get-Content wails.json -Raw
          if ($raw -notmatch '"productVersion"') {
            Write-Error "wails.json missing info.productVersion - cannot sync version"
            exit 1
          }
          $raw = $raw -replace '"productVersion"\s*:\s*"[^"]*"', "`"productVersion`": `"$rev`""
          Set-Content wails.json $raw -Encoding utf8
          Write-Host "wails.json info.productVersion -> $rev"

      - name: Build executable (wails)
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          # version.txt 是版本号的唯一来源，必须经 -ldflags 注入 Go 变量：
          # wails.json 的 productVersion 只渲染进 exe 的 Windows 属性，
          # 界面显示的版本号与更新比较用的是 model.Version()，缺了注入
          # 就会停在 version.go 里写死的兜底值，与 tag / exe 属性三方漂移。
          # SetVersion 只接受非空白值，注入空串会被忽略，不会把版本打成空。
          $rev = $env:APP_VERSION
          wails build -platform windows/amd64 -clean `
            -ldflags "-X `"github.com/Lexo0522/one-key-dialer/internal/model.version=$rev`""
          if ($LASTEXITCODE -ne 0) { Write-Error "wails build failed"; exit 1 }
          if (-not (Test-Path build/bin/PPPoEDialer.exe)) {
            Write-Error "build/bin/PPPoEDialer.exe missing"
            exit 1
          }

      - name: Verify exe metadata
        shell: pwsh
        run: |
          # 用 Explorer 同款 Shell 属性系统读取（.NET 的 FileVersionInfo 对
          # Go/WinRes 组合的 PE 存在读取兼容性问题，不能作为判据）
          $rev = $env:APP_VERSION
          $exe = "build/bin/PPPoEDialer.exe"
          $shell = New-Object -ComObject Shell.Application
          $folder = $shell.Namespace((Resolve-Path "build/bin").Path)
          $file = $folder.ParseName("PPPoEDialer.exe")
          $fileVersion = $folder.GetDetailsOf($file, 166)   # 文件版本
          $productVersion = $folder.GetDetailsOf($file, 300) # 产品版本
          $copyright = $folder.GetDetailsOf($file, 25)       # 版权
          Write-Host "FileVersion=$fileVersion ProductVersion=$productVersion"
          Write-Host "LegalCopyright=$copyright"
          if ($fileVersion -notlike "$rev*" -or $productVersion -notlike "$rev*") {
            Write-Error "exe version ($fileVersion / $productVersion) does not match version.txt ($rev)"
            exit 1
          }
          if (-not $copyright) {
            Write-Error "exe LegalCopyright is empty"
            exit 1
          }

      - name: Ensure WiX toolset v3 (candle/light for the MSI)
        shell: pwsh
        run: |
          $wixBin = "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin"
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path (Join-Path $wixBin 'candle.exe'))) {
              Write-Host "candle.exe not found - installing WiX via chocolatey"
              choco install wixtoolset -y --no-progress
            }
            if (Test-Path (Join-Path $wixBin 'candle.exe')) {
              Add-Content $env:GITHUB_PATH $wixBin
            } else {
              Write-Error "WiX toolset binary directory not found after install"
              exit 1
            }
          }

      - name: Package ZIP + MSI + SHA256SUMS
        shell: pwsh
        run: |
          $rev = $env:APP_VERSION
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $zip = "release/PPPoEDialer-$rev-windows.zip"
          $msi = "release/PPPoEDialer-$rev-windows.msi"

          # zip 内包一层固定名文件夹 PPPoEDialer（不带版本号）：解压后是
          # 一个完整的程序文件夹，且多版本解压到同一位置时覆盖同一文件夹，
          # 不会留下 PPPoEDialer-1.2.3 / -1.2.4 之类的残留。应用内更新端
          # 的 findPayloadRoot 把「zip 根下唯一的文件夹」当作负载根，不
          # 依赖文件夹名，固定名对更新流程无影响。
          $payload = "release/PPPoEDialer"
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          Copy-Item build/bin/PPPoEDialer.exe $payload -Force
          Compress-Archive -Path $payload -DestinationPath $zip -Force

          $wixSrc = "build/windows/installer/Product.wxs"
          & candle.exe -nologo -out release\ `
            -dVersion="$rev" `
            -dSrcDir="build/bin" `
            -dIconPath="build/windows/icon.ico" `
            -dLicensePath="build/windows/installer/license.rtf" `
            $wixSrc
          if ($LASTEXITCODE -ne 0) { Write-Error "candle.exe failed"; exit 1 }

          # -cultures:zh-cn is load-bearing: the extension's default en-us
          # WixUI_en-US.wxl carries Codepage=1252, which light applies over
          # Product/@Codepage and which cannot encode the Chinese strings in
          # Product.wxs (LGHT0311). The zh-CN wxl brings codepage 936.
          & light.exe -nologo -out $msi -ext WixUIExtension -cultures:zh-cn release\Product.wixobj
          if ($LASTEXITCODE -ne 0) { Write-Error "light.exe failed"; exit 1 }

          # SHA256SUMS.txt: "<hash>  <filename>" — parsed strictly by internal/update.
          $zipName = [System.IO.Path]::GetFileName($zip)
          $msiName = [System.IO.Path]::GetFileName($msi)
          $lines = @()
          foreach ($name in @($zipName, $msiName)) {
            $h = (Get-FileHash -Algorithm SHA256 (Join-Path release $name)).Hash.ToLowerInvariant()
            $lines += "$h  $name"
          }
          Set-Content -Path release/SHA256SUMS.txt -Value $lines -Encoding ascii

      - name: Verify release assets
        shell: pwsh
        run: |
          $rev = $env:APP_VERSION
          foreach ($f in @(
              "release/PPPoEDialer-$rev-windows.zip",
              "release/PPPoEDialer-$rev-windows.msi",
              "release/SHA256SUMS.txt")) {
            if (-not (Test-Path $f)) {
              Write-Error "release asset missing: $f"
              exit 1
            }
          }
          $sums = @(Get-Content release/SHA256SUMS.txt | Where-Object { $_.Trim() })
          if ($sums.Count -lt 2) {
            Write-Error "SHA256SUMS.txt does not cover both assets"
            exit 1
          }
          # zip 结构契约：根下唯一文件夹 PPPoEDialer，内含 exe。手动解压
          # 的用户与更新端 findPayloadRoot 都依赖这个布局。
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead(
            (Resolve-Path "release/PPPoEDialer-$rev-windows.zip").Path)
          try {
            # 归一化分隔符：Windows PowerShell 5.1 的 Compress-Archive 会写
            # 反斜杠条目名（pwsh 7 写规范的 /），校验对两种都放行。
            $entries = @($archive.Entries | ForEach-Object { $_.FullName -replace '\\', '/' })
          } finally {
            $archive.Dispose()
          }
          if ($entries -notcontains "PPPoEDialer/PPPoEDialer.exe") {
            Write-Error ("unexpected zip layout (want PPPoEDialer/PPPoEDialer.exe, got):`n  " +
              ($entries -join "`n  "))
            exit 1
          }
          Write-Host "Release assets verified:"
          Get-ChildItem release/*.zip, release/*.msi, release/SHA256SUMS.txt |
            ForEach-Object { Write-Host ("  " + $_.Name) }

      - name: Upload build artifact (backup)
        uses: actions/upload-artifact@v5
        with:
          name: PPPoEDialer-release-assets
          path: |
            release/*.zip
            release/*.msi
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:TAG
          $rev = $env:APP_VERSION
          $files = @(
            "release/PPPoEDialer-$rev-windows.zip",
            "release/PPPoEDialer-$rev-windows.msi",
            "release/SHA256SUMS.txt")
          # Idempotent: a re-run (or a moved tag) hits an existing release —
          # refresh the assets instead of failing on `gh release create`.
          # 正文不在这里生成：--generate-notes 建一个占位 release，发布说明由
          # 人工在发布后补写。程序端（app:update → UpdateDialog）直接展示渠道
          # 返回的 body，两侧不同步也不会互相覆盖。
          $existing = gh release view $tag --json tagName -q .tagName 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing) {
            Write-Host "Release $tag already exists - refreshing assets"
            gh release upload $tag $files --clobber
            # Deleting the tag turns a published release back into a draft;
            # un-draft it or the re-pushed tag's release stays invisible.
            gh release edit $tag --draft=false
          } else {
            gh release create $tag $files `
              --verify-tag --title "PPPoEDialer $tag" --generate-notes
          }
          Write-Host "Release $tag published"

      - name: Mirror release to Gitee
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
          TAG: ${{ env.TAG }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not $env:GITEE_TOKEN -or -not $env:GITEE_REPO) {
            Write-Host "GITEE_TOKEN / GITEE_REPO not configured - skipping mirror"
            exit 0
          }
          ./scripts/sync_release_to_gitee.ps1
