name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        java: ['17', '26']
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Verify canonical version
        shell: cmd
        run: |
          set "APP_VER="
          for /f "tokens=2 delims==" %%A in ('findstr /b /c:"-Drevision=" ".mvn\maven.config"') do set "APP_VER=%%A"
          if not defined APP_VER (
            echo revision missing from .mvn\maven.config
            exit /b 1
          )
          findstr /l /c:"<version>${revision}</version>" pom.xml >nul
          if errorlevel 1 (
            echo pom.xml must use ^<version^>${revision}^</version^> as its project version
            exit /b 1
          )
          findstr /l /c:"app.version=${revision}" version.properties >nul
          if errorlevel 1 (
            echo version.properties must use app.version=${revision}
            exit /b 1
          )
          echo Canonical version: %APP_VER%

      - name: Maven JUnit with coverage and Error Prone
        if: matrix.java == '17'
        # PowerShell parses an unquoted comma as an argument separator.
        run: mvn -B -q clean test "-Pcoverage,errorprone"

      - name: Maven JUnit
        if: matrix.java != '17'
        run: mvn -B -q clean test

      - name: Upload coverage report
        if: matrix.java == '17'
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: target/site/jacoco/
          if-no-files-found: error

  package:
    needs: test
    runs-on: windows-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Build app-image
        shell: cmd
        env:
          CI: "true"
          GITHUB_ACTIONS: "true"
        run: |
          call build_jpackage.bat
          if errorlevel 1 (
            echo app-image build script failed
            exit /b 1
          )
          if not exist output\PPoEDialer\PPoEDialer.exe (
            echo app-image missing
            exit /b 1
          )

      - name: Upload app-image
        uses: actions/upload-artifact@v5
        with:
          name: PPoEDialer-app-image
          path: output/PPoEDialer
          if-no-files-found: error
