name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '22'

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify canonical version
        shell: pwsh
        run: |
          $rev = (Get-Content version.txt -Raw).Trim()
          if (-not $rev) {
            Write-Error "version.txt is empty - it is the single source of truth for the app version"
            exit 1
          }
          if ($rev -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "version.txt must be a bare semver (got '$rev')"
            exit 1
          }
          Add-Content $env:GITHUB_ENV "APP_VERSION=$rev"
          Write-Host "Canonical version: $rev"

      - name: gofmt check
        shell: pwsh
        run: |
          $bad = gofmt -l .
          if ($bad) {
            Write-Error "not gofmt-clean:`n$bad"
            exit 1
          }

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      - name: Build app (wails)
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          wails build -platform windows/amd64
          if (-not (Test-Path build/bin/PPoEDialer.exe)) {
            Write-Error "build/bin/PPoEDialer.exe missing"
            exit 1
          }

      - name: Upload app binary
        uses: actions/upload-artifact@v5
        with:
          name: PPoEDialer-exe
          path: build/bin/PPoEDialer.exe
          if-no-files-found: error
