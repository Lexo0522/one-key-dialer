name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '22'

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify canonical version
        shell: pwsh
        run: |
          $rev = (Get-Content version.txt -Raw).Trim()
          if (-not $rev) {
            Write-Error "version.txt is empty - it is the single source of truth for the app version"
            exit 1
          }
          if ($rev -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "version.txt must be a bare semver (got '$rev')"
            exit 1
          }
          Add-Content $env:GITHUB_ENV "APP_VERSION=$rev"
          Write-Host "Canonical version: $rev"

          # 版本号三处声明必须与 version.txt 一致，任一处漂移都在这里失败：
          #   internal/model/version.go  兜底值与包变量（本地构建不注入时的版本）
          #   wails.json info.productVersion  渲染进 exe 的 Windows 属性
          #   frontend/package.json  version  前端侧声明
          # 漂移的后果不是 cosmetic：界面版本走 model.Version()，
          # 它同时是更新比较的「当前版本」基准。
          $goSrc = Get-Content internal/model/version.go -Raw
          # 不用 (?m)^ 锚定：Windows PowerShell 5.1 对 -Raw 读入的 CRLF 文本
          # 加该锚点会匹配不上（pwsh 7 下却可以），去掉锚点更稳。
          $goFallback = [regex]::Match($goSrc, 'const fallbackVersion = "([^"]+)"').Groups[1].Value
          $goVar = [regex]::Match($goSrc, 'var version = "([^"]+)"').Groups[1].Value
          $wails = [regex]::Match(
            (Get-Content wails.json -Raw), '"productVersion"\s*:\s*"([^"]+)"').Groups[1].Value
          $pkg = [regex]::Match(
            (Get-Content frontend/package.json -Raw), '"version"\s*:\s*"([^"]+)"').Groups[1].Value

          $drift = @()
          if ($goFallback -ne $rev) { $drift += "internal/model/version.go fallbackVersion = '$goFallback'" }
          if ($goVar -ne $rev) { $drift += "internal/model/version.go var version = '$goVar'" }
          if ($wails -ne $rev) { $drift += "wails.json productVersion = '$wails'" }
          if ($pkg -ne $rev) { $drift += "frontend/package.json version = '$pkg'" }
          if ($drift.Count -gt 0) {
            Write-Error ("version.txt is '$rev' but these disagree:`n  " + ($drift -join "`n  "))
            exit 1
          }
          Write-Host "All version declarations agree with version.txt ($rev)"

      - name: gofmt check
        shell: pwsh
        run: |
          $bad = gofmt -l .
          if ($bad) {
            Write-Error "not gofmt-clean:`n$bad"
            exit 1
          }

      # 前端测试与类型检查放在构建前：format/i18n/presets 都是纯函数，跑得快，
      # 挂了就直接失败，不必等 vite 构建完才发现。typecheck 守的是 bridge.js
      # 与 wailsjs 生成绑定之间的字段契约（后端改 Settings 时这里会先炸）。
      - name: Test frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # 仓库已达到 0 issue，这里作为硬门禁：新增的未检查 error、未关闭的
      # body、死代码都会在 CI 直接失败。
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          golangci-lint run --timeout 5m

      - name: go vet
        run: go vet ./...

      # -race 是必须的：托盘、监控、更新下载、停滞看门狗全都起常驻 goroutine，
      # 共享状态只靠注释约定是不够的，竞态只会偶现在用户机器上。
      - name: go test
        run: go test ./... -count=1 -race

      - name: Build app (wails)
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          # 与 release 流程一致地注入 version.txt：CI 构建的 exe 里
          # 界面版本号不应停在 version.go 的兜底值
          wails build -platform windows/amd64 `
            -ldflags "-X `"github.com/Lexo0522/one-key-dialer/internal/model.version=$env:APP_VERSION`""
          if ($LASTEXITCODE -ne 0) { Write-Error "wails build failed"; exit 1 }
          if (-not (Test-Path build/bin/PPPoEDialer.exe)) {
            Write-Error "build/bin/PPPoEDialer.exe missing"
            exit 1
          }

      - name: Upload app binary
        uses: actions/upload-artifact@v5
        with:
          name: PPPoEDialer-exe
          path: build/bin/PPPoEDialer.exe
          if-no-files-found: error
